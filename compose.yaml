name: dlc-e2e
x-restart: &restart {restart: unless-stopped}

services:
  dlc-postgres:
    <<: *restart
    image: postgres:17.11-alpine3.24
    environment: {POSTGRES_DB: di_lucca, POSTGRES_USER: postgres, POSTGRES_PASSWORD_FILE: /run/secrets/pg}
    secrets: [pg]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d di_lucca"], interval: 3s, retries: 20}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    networks: [edge]

  iam-db-migrate:
    image: liquibase/liquibase:4.33.0
    profiles: [tooling]
    working_dir: /workspace
    volumes: ["../../iam/dlc-iam-db:/workspace:ro"]
    secrets: [{source: iam_migrator, target: iam_migrator_password}]
    environment: {DLC_POSTGRES_HOST: dlc-postgres, DLC_POSTGRES_DB: di_lucca}
    entrypoint: ["/bin/sh", "/workspace/deploy/run-migration.sh"]
    command: ["update"]
    networks: [edge]

  patients-db-migrate:
    image: liquibase/liquibase:4.29.2
    profiles: [tooling]
    volumes: ["../../patients/dlc-patient-db:/workspace:ro"]
    secrets: [{source: patients_migrator, target: patients_migrator_password}]
    environment: {PG_HOST: dlc-postgres, PG_DATABASE: di_lucca, PG_ENVIRONMENT: dev}
    entrypoint: ["/bin/sh", "/workspace/deploy/run-migration.sh"]
    command: ["update"]
    networks: [edge]

  appointments-db-migrate:
    image: liquibase/liquibase:4.33.0
    profiles: [tooling]
    working_dir: /workspace
    volumes: ["../../appointments/dlc-appointments-db:/workspace:ro"]
    secrets: [{source: appointments_migrator, target: appointments_migrator_password}]
    environment: {DLC_ENVIRONMENT: dev, DLC_POSTGRES_HOST: dlc-postgres, DLC_POSTGRES_DB: di_lucca}
    entrypoint: ["/bin/sh", "/workspace/deploy/run-migration.sh"]
    command: ["update"]
    networks: [edge]

  rabbitmq:
    <<: *restart
    image: rabbitmq:3.13-alpine
    environment: {RABBITMQ_DEFAULT_USER: e2e, RABBITMQ_DEFAULT_PASS: "${RMQ_PASS}"}
    networks: [edge]

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.27
    environment: {MP_SMTP_AUTH_ACCEPT_ANY: "1", MP_SMTP_AUTH_ALLOW_INSECURE: "1"}
    ports: ["18025:8025"]
    networks: [edge]

  svc-jwks:
    <<: *restart
    image: nginx:1.27-alpine
    volumes: ["${DLC_RUNTIME_DIR}/svc:/usr/share/nginx/html:ro"]
    networks: [edge]

  auth-service:
    <<: *restart
    image: dlc-iam-api:e2e
    env_file: ["${DLC_RUNTIME_DIR}/secrets/iam.env"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      IAM_AUTH_ALLOWED_ORIGIN: http://localhost:8081
      IAM_TRUSTED_GATEWAY_IP: 172.30.0.11
    networks: [edge]

  patients-api:
    <<: *restart
    image: dlc-patient-api:e2e
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      SERVER_PORT: "8080"
      PATIENTS_DB_ENABLED: "true"
      PATIENTS_DB_ENVIRONMENT: dev
      PATIENTS_DB_HOST: dlc-postgres
      PATIENTS_DB_PORT: "5432"
      PATIENTS_DB_NAME: di_lucca
      PATIENTS_DB_SSLMODE: disable
      PATIENTS_DB_PASSWORD_FILE: /run/secrets/patients/password
      PATIENTS_IAM_ENABLED: "true"
      PATIENTS_IAM_ENVIRONMENT: dev
      PATIENTS_IAM_BASE_URL: http://auth-service:8080
      PATIENTS_IAM_ISSUER: https://iam.dev.dlc.test
      PATIENTS_IAM_AUDIENCE: dlc-api
      PATIENTS_IAM_REGISTRATION_PERMISSION: patients:register
      PATIENTS_IAM_SEARCH_PERMISSION: patients:read
      PATIENTS_IAM_UPDATE_PERMISSION: patients:write
      PATIENTS_IAM_SERVICE_TOKEN_FILE: /run/secrets/iam/service-token
      PATIENTS_APPOINTMENTS_BASE_URL: http://appointments-api:8080
      PATIENTS_APPOINTMENTS_SERVICE_TOKEN_FILE: /run/secrets/appointments/service-token
      PATIENTS_INTERNAL_ENABLED: "true"
      PATIENTS_INTERNAL_ADDRESS: 0.0.0.0
      PATIENTS_INTERNAL_PORT: "9091"
      PATIENTS_INTERNAL_PUBLIC_KEY_FILE: /run/secrets/internal/service-public.pem
      PATIENTS_INTERNAL_KEY_ID: svc-dev-1
      PATIENTS_INTERNAL_ISSUER: https://services.dev.dlc.test
      PATIENTS_INTERNAL_AUDIENCE: patients-api
    volumes:
      - ${DLC_RUNTIME_DIR}/secrets/patients-iam:/run/secrets/iam:ro
      - ${DLC_RUNTIME_DIR}/secrets/patients-apt:/run/secrets/appointments:ro
      - ${DLC_RUNTIME_DIR}/secrets/patients-db:/run/secrets/patients:ro
      - ${DLC_RUNTIME_DIR}/secrets/pat-int:/run/secrets/internal:ro
    networks: [edge]

  appointments-api:
    <<: *restart
    image: dlc-appointments-api:e2e
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://dlc-postgres:5432/di_lucca
      DB_USERNAME: appointments_runtime
      DB_PASSWORD: "${APT_DB_PASSWORD}"
      JWT_PUBLIC_KEY_FILE: /run/secrets/apt/staff.pub
      JWT_ISSUER: https://iam.dev.dlc.test
      JWT_AUDIENCE: dlc-api
      INTERNAL_SERVICE_JWT_PUBLIC_KEY_FILE: /run/secrets/apt/service.pub
      INTERNAL_SERVICE_JWT_ISSUER: https://services.dev.dlc.test
      INTERNAL_SERVICE_JWT_AUDIENCE: appointments-api
      AUTH_INTERNAL_URL: http://auth-service:8080
      AUTH_SERVICE_TOKEN_FILE: /run/secrets/apt/auth-token
      PATIENTS_INTERNAL_URL: http://patients-api:9091
      PATIENTS_SERVICE_TOKEN_FILE: /run/secrets/apt/patients-token
      APPOINTMENTS_RABBITMQ_URI: "amqp://e2e:${RMQ_PASS}@rabbitmq:5672"
      APPOINTMENTS_RELAY_ENABLED: "true"
      APPOINTMENTS_REMINDERS_ENABLED: "false"
      APPOINTMENTS_CONSUMERS_ENABLED: "true"
    volumes: ["${DLC_RUNTIME_DIR}/secrets/apt:/run/secrets/apt:ro"]
    networks: [edge]

  billing-api:
    <<: *restart
    image: dlc-billing-api:e2e
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      SPRING_DATASOURCE_URL: jdbc:postgresql://dlc-postgres:5432/di_lucca
      SPRING_DATASOURCE_USERNAME: billing_runtime
      SPRING_DATASOURCE_PASSWORD: "${BILLING_DB_PASSWORD}"
      BILLING_IAM_JWKS_URI: http://auth-service:8080/api/v1/auth/jwks
      IAM_JWT_ISSUER: https://iam.dev.dlc.test
      IAM_JWT_AUDIENCE: dlc-api
      BILLING_IAM_ORIGIN: http://auth-service:8080
      BILLING_IAM_SERVICE_TOKEN_FILE: /run/secrets/billing/auth-token
      BILLING_IAM_LOCAL_DEVELOPMENT: "true"
      BILLING_APPOINTMENTS_ORIGIN: http://appointments-api:8080
      BILLING_APPOINTMENTS_SERVICE_TOKEN_FILE: /run/secrets/billing/appointments-token
      BILLING_APPOINTMENTS_LOCAL_DEVELOPMENT: "true"
      BILLING_PATIENTS_ORIGIN: http://patients-api:9091
      BILLING_PATIENTS_LOCAL_DEVELOPMENT: "true"
      BILLING_OUTBOX_RELAY_ENABLED: "true"
      BILLING_RABBITMQ_URI_FILE: /run/secrets/billing/rabbitmq-uri
      BILLING_RABBITMQ_LOCAL_DEVELOPMENT: "true"
      BILLING_CLINICAL_CONSUMER_ENABLED: "true"
      BILLING_SERVICE_JWT_PUBLIC_KEY_FILE: /run/secrets/billing/service-public.pem
      BILLING_SERVICE_JWT_ISSUER: https://services.dev.dlc.test
      BILLING_SERVICE_JWT_AUDIENCE: billing-api
      BILLING_WORKER_SERVICE_SUBJECT: dlc-worker
      BILLING_CLINICAL_SERVICE_SUBJECT: clinical-api
    volumes: ["${DLC_RUNTIME_DIR}/secrets/billing:/run/secrets/billing:ro"]
    networks: [edge]

  clinical-outbox-relay: &clinical-worker
    <<: *restart
    image: dlc-clinical-api:e2e
    entrypoint: ["/clinical-outbox-relay"]
    environment:
      APP_ENV: dev
      MONGO_URI: mongodb://dlc-mongo:27017/?replicaSet=rs0
      MONGO_PASSWORD_FILE: /run/secrets/clinical/clinical-runtime-password
      MONGO_DATABASE: clinical
      RABBITMQ_URL: "amqp://e2e:${RMQ_PASS}@rabbitmq:5672/"
      APPOINTMENTS_INTERNAL_URL: http://appointments-api:8080
      BILLING_INTERNAL_URL: http://billing-api:8080
      APPOINTMENTS_SERVICE_TOKEN_FILE: /run/secrets/clinical/appointments-token
      BILLING_SERVICE_TOKEN_FILE: /run/secrets/clinical/billing-token
      SERVICE_TOKEN_FILE: /run/secrets/clinical/auth-token
      CLINIC_TIMEZONE: America/Bogota
    volumes: ["${DLC_RUNTIME_DIR}/secrets/cln:/run/secrets/clinical:ro"]
    networks: [edge, clinical-data]
  clinical-inbox-consumer:     {<<: *clinical-worker, entrypoint: ["/clinical-inbox-consumer"]}
  clinical-intent-reconciler:  {<<: *clinical-worker, entrypoint: ["/clinical-intent-reconciler"]}
  clinical-analytics-consumer: {<<: *clinical-worker, entrypoint: ["/clinical-analytics-consumer"]}

  clinical-api:
    <<: *restart
    image: dlc-clinical-api:e2e
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: dev
      JWT_ISSUER: https://iam.dev.dlc.test
      JWT_AUDIENCE: dlc-api
      JWT_PUBLIC_KEY_FILE: /run/secrets/clinical/staff.pub
      MONGO_URI: mongodb://dlc-mongo:27017/?replicaSet=rs0
      MONGO_PASSWORD_FILE: /run/secrets/clinical/clinical-runtime-password
      MONGO_DATABASE: clinical
      AUTH_INTERNAL_URL: http://auth-service:8080
      PATIENTS_INTERNAL_URL: http://patients-api:9091
      APPOINTMENTS_INTERNAL_URL: http://appointments-api:8080
      BILLING_INTERNAL_URL: http://billing-api:8080
      AUTH_SERVICE_TOKEN_FILE: /run/secrets/clinical/auth-token
      PATIENTS_SERVICE_TOKEN_FILE: /run/secrets/clinical/patients-token
      APPOINTMENTS_SERVICE_TOKEN_FILE: /run/secrets/clinical/appointments-token
      BILLING_SERVICE_TOKEN_FILE: /run/secrets/clinical/billing-token
      SERVICE_TOKEN_FILE: /run/secrets/clinical/auth-token
      CLINIC_TIMEZONE: America/Bogota
    volumes: ["${DLC_RUNTIME_DIR}/secrets/cln:/run/secrets/clinical:ro"]
    networks: [edge, clinical-data]

  dlc-worker:
    <<: *restart
    image: dlc-worker:e2e
    environment:
      JAVA_TOOL_OPTIONS: -Xmx192m
      DB_URL: jdbc:postgresql://dlc-postgres:5432/di_lucca
      DB_USERNAME: notifications_runtime
      DB_PASSWORD: "${NOTIFICATIONS_DB_PASSWORD}"
      WORKER_RABBITMQ_URI: "amqp://e2e:${RMQ_PASS}@rabbitmq:5672"
      APPOINTMENTS_INTERNAL_URL: http://appointments-api:8080
      APPOINTMENTS_SERVICE_TOKEN_FILE: /run/secrets/worker/appointments-token
      PATIENTS_INTERNAL_URL: http://patients-api:9091
      PATIENTS_SERVICE_TOKEN_FILE: /run/secrets/worker/patients-token
      BILLING_INTERNAL_URL: http://billing-api:8080
      BILLING_SERVICE_TOKEN_FILE: /run/secrets/worker/billing-token
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_FROM: facturacion@dilucca.test
    volumes: ["${DLC_RUNTIME_DIR}/secrets/worker:/run/secrets/worker:ro"]
    networks: [edge]

  api-gateway:
    <<: *restart
    image: dlc-api-gateway:e2e
    environment: {GATEWAY_ALLOWED_ORIGIN: "http://localhost:8081", GATEWAY_TRUSTED_PROXY: 172.30.0.10/32}
    networks:
      edge: {ipv4_address: 172.30.0.11, aliases: [dlc-api-gateway]}

  iam-portal:          {<<: *restart, image: "dlc-iam-portal:e2e", networks: [edge]}
  patient-portal:      {<<: *restart, image: "dlc-patient-portal:e2e", networks: [edge]}
  appointments-portal: {<<: *restart, image: "dlc-appointments-portal:e2e", networks: [edge]}
  billing-portal:      {<<: *restart, image: "dlc-billing-portal:e2e", networks: [edge]}
  clinical-portal:
    <<: *restart
    image: dlc-clinical-portal:e2e
    networks: {edge: {aliases: [clinical-portal-dlc-front]}}

  dlc-front:
    <<: *restart
    image: dlc-front:e2e
    environment:
      IAM_UPSTREAM: http://iam-portal
      PATIENT_UPSTREAM: http://patient-portal
      CLINICAL_UPSTREAM: http://clinical-portal-dlc-front
      APPOINTMENTS_UPSTREAM: http://appointments-portal
      BILLING_UPSTREAM: http://billing-portal
      GATEWAY_UPSTREAM: http://dlc-api-gateway:8080/api/v1
    ports: ["8081:80"]
    volumes:
      - ${DLC_RUNTIME_DIR}/registry:/usr/share/nginx/deployment:ro
      - ${DLC_RUNTIME_DIR}/auth-config.json:/usr/share/nginx/auth/auth-config.json:ro
    networks: {edge: {ipv4_address: 172.30.0.10}}

networks:
  edge: {name: e2e-edge, ipam: {config: [{subnet: 172.30.0.0/24}]}}
  clinical-data: {external: true, name: clinical-data-e2e}

secrets:
  pg: {file: "${DLC_RUNTIME_DIR}/secrets/pg.txt"}
  iam_migrator: {file: "${DLC_RUNTIME_DIR}/secrets/iam-migrator-password.txt"}
  patients_migrator: {file: "${DLC_RUNTIME_DIR}/secrets/patients-migrator.txt"}
  appointments_migrator: {file: "${DLC_RUNTIME_DIR}/secrets/appointments-migrator.txt"}

volumes:
  pg_data:
