# Isolated local Clinical database pipeline using the domain-owned migration
# artifact and the identities supplied by dlc-infra-mongo.
services:
  dlc-mongo:
    image: mongo:8.0.32@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ${DLC_RUNTIME_DIR:-./.local}/mongo-secrets/mongo-root-password.txt:/run/secrets/mongo_root_password:ro
      - ${DLC_RUNTIME_DIR:-./.local}/mongo-secrets/mongo-keyfile:/run/secrets/mongo_keyfile:ro
    entrypoint: ["bash", "-c", "install -m 400 -o mongodb -g mongodb /run/secrets/mongo_keyfile /data/configdb/keyfile && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/configdb/keyfile"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 10s
      timeout: 30s
      retries: 30
    networks: [clinical-data]

  dlc-mongo-init:
    image: mongo:8.0.32@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2
    depends_on:
      dlc-mongo: {condition: service_started}
    environment:
      DLC_MONGO_HOST: dlc-mongo:27017
      DLC_MONGO_REPLICA_SET: rs0
      DLC_MONGO_ROOT_USER: root
      DLC_MONGO_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      DLC_CLINICAL_MIGRATOR_PASSWORD_FILE: /run/secrets/clinical_migrator_password
      DLC_CLINICAL_BACKUP_PASSWORD_FILE: /run/secrets/clinical_backup_password
    volumes:
      - ../../dlc-infra-mongo/dlc-infra-mongo/scripts:/scripts:ro
      - ${DLC_RUNTIME_DIR:-./.local}/mongo-secrets/mongo-root-password.txt:/run/secrets/mongo_root_password:ro
      - ${DLC_RUNTIME_DIR:-./.local}/mongo-secrets/clinical-migrator-password.txt:/run/secrets/clinical_migrator_password:ro
      - ${DLC_RUNTIME_DIR:-./.local}/mongo-secrets/clinical-backup-password.txt:/run/secrets/clinical_backup_password:ro
    entrypoint: ["mongosh", "--quiet", "--norc", "mongodb://dlc-mongo:27017/?directConnection=true", "/scripts/init.js"]
    restart: on-failure:10
    networks: [clinical-data]

  clinical-db-migrate:
    build:
      context: ../../clinical/dlc-clinical-db
      dockerfile: deploy/liquibase.Dockerfile
    image: dlc-clinical-db-migrate:local
    depends_on:
      dlc-mongo-init: {condition: service_completed_successfully}
      dlc-mongo: {condition: service_healthy}
    environment: {DLC_ENVIRONMENT: dev, MONGO_HOST: dlc-mongo, MONGO_PORT: "27017", MONGO_REPLICA_SET: rs0}
    volumes:
      - ${DLC_RUNTIME_DIR:-./.local}/mongo-secrets/clinical-migrator-password.txt:/run/secrets/clinical_migrator_password:ro
    working_dir: /workspace
    entrypoint: ["/workspace/deploy/run-migration.sh"]
    command: ["update"]
    networks: [clinical-data]

  dlc-mongo-runtime-identity:
    image: mongo:8.0.32@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2
    depends_on:
      clinical-db-migrate: {condition: service_completed_successfully}
    environment:
      DLC_MONGO_ROOT_USER: root
      DLC_MONGO_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      DLC_CLINICAL_RUNTIME_PASSWORD_FILE: /run/secrets/clinical_runtime_password
    volumes:
      - ../../dlc-infra-mongo/dlc-infra-mongo/scripts:/scripts:ro
      - ${DLC_RUNTIME_DIR:-./.local}/mongo-secrets/mongo-root-password.txt:/run/secrets/mongo_root_password:ro
      - ${DLC_RUNTIME_DIR:-./.local}/mongo-secrets/clinical-runtime-password.txt:/run/secrets/clinical_runtime_password:ro
    entrypoint: ["mongosh", "--quiet", "--norc", "mongodb://dlc-mongo:27017/?replicaSet=rs0", "/scripts/runtime-identity.js"]
    networks: [clinical-data]

networks:
  clinical-data: {}
volumes:
  mongo_data: {}
  mongo_config: {}
